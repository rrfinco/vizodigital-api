services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: api-portal-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:9021
      # DB_* come from .env — remote PROD or UAT only (no local MySQL).
    networks:
      - portal

  nginx:
    image: nginx:1.27-alpine
    container_name: api-portal-nginx
    restart: unless-stopped
    ports:
      - "9021:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portal

  node:
    image: node:22-alpine
    container_name: api-portal-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run build"
    profiles:
      - build
    networks:
      - portal

networks:
  portal:
    driver: bridge
